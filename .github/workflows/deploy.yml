name: Auto Deploy (Staging & Live)

on:
  push:
    branches:
      - preview
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Select Deployment Target
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "repo_path=/home/goodnite/home/goodnite/repositories/goodnite-live" >> $GITHUB_OUTPUT
            echo "env_name=Production (goodnite.in)" >> $GITHUB_OUTPUT
          else
            echo "repo_path=/home/goodnite/home/goodnite/repositories/goodnite-staging" >> $GITHUB_OUTPUT
            echo "env_name=Staging (staging.goodnite.in)" >> $GITHUB_OUTPUT
          fi

      - name: Trigger cPanel Git Pull & Deploy
        run: |
          echo "Deploying to ${{ steps.target.outputs.env_name }}..."
          REPO_PATH="${{ steps.target.outputs.repo_path }}"

          # Clean host: remove https://, http://, ports, and trailing slashes
          RAW_HOST="${{ secrets.CPANEL_HOST }}"
          CLEAN_HOST=$(echo "$RAW_HOST" | sed -E 's|https?://||' | sed -E 's|:.*||' | sed -E 's|/.*||' | xargs)

          echo "Target server: ${CLEAN_HOST}"

          # 1. Update repository from remote
          echo "Step 1: Pulling latest changes..."
          UPDATE_RES=$(curl -sS -k -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            "https://${CLEAN_HOST}:2083/execute/VersionControl/update?repository_root=${REPO_PATH}")
          echo "Update result: $UPDATE_RES"

          # 2. Deploy HEAD commit via .cpanel.yml
          echo "Step 2: Deploying files via .cpanel.yml..."
          DEPLOY_RES=$(curl -sS -k -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            "https://${CLEAN_HOST}:2083/execute/VersionControlDeployment/create?repository_root=${REPO_PATH}")
          echo "Deployment result: $DEPLOY_RES"
