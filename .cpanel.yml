---
deployment:
  tasks:
    - export DEPLOY_ROOT="/home/nitegoodin/public_html"
    - /bin/mkdir -p $DEPLOY_ROOT/wp-content/themes
    - /bin/mkdir -p $DEPLOY_ROOT/wp-content/plugins
    - /bin/cp -R wp-content/* $DEPLOY_ROOT/wp-content/
    - /bin/mkdir -p $DEPLOY_ROOT/wp/wp-content/themes
    - /bin/mkdir -p $DEPLOY_ROOT/wp/wp-content/plugins
    - /bin/cp -R wp-content/* $DEPLOY_ROOT/wp/wp-content/
